<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas AI Prototype</title>
    
    <!-- Application CSS -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/ai.css">
</head>
<body>
    <!-- Main application root -->
    <div id="app-root">
        
        <!-- Top application bar -->
        <header id="app-top-bar">
            <div id="app-title">Canvas AI Prototype</div>
            <div id="app-status">Ready</div>
        </header>
        
        <!-- Main workspace area -->
        <main id="app-workspace">
            
            <!-- Canvas container - where the existing Canvas system lives -->
            <div id="canvas-container">
                <!-- Required by canvas.js: FreeCanvasManager.containerId = 'view-canvas' -->
                <div id="view-canvas"></div>
            </div>
            
            <!-- AI Chat Panel -->
            <aside id="ai-panel">
                <div class="ai-panel-header">
                    <span class="ai-panel-title">AI Assistant</span>
                    <div class="ai-panel-header-actions">
                        <button id="ai-new-chat-btn" class="ai-new-chat-btn" aria-label="Start new chat">New Chat</button>
                        <button id="ai-settings-btn" class="ai-settings-btn" aria-label="Open settings" title="Settings">&#9881;</button>
                    </div>
                </div>
                <div id="ai-messages" class="ai-messages-container" aria-live="polite"></div>
                <div id="ai-status" class="ai-status" role="status"></div>
                <div id="ai-loading" class="ai-loading" aria-hidden="true">Processing...</div>
                
                <!-- Settings View (hidden by default) -->
                <div id="ai-settings-view" class="ai-settings-view" aria-hidden="true">
                    <div class="ai-settings-header">
                        <button id="ai-settings-back-btn" class="ai-settings-back-btn" aria-label="Back to chat">&#8592; AI Settings</button>
                    </div>
                    <div class="ai-settings-content">
                        <div class="ai-settings-field">
                            <label for="ai-settings-provider" class="ai-settings-label">Provider</label>
                            <select id="ai-settings-provider" class="ai-settings-select">
                                <option value="">Select Provider</option>
                            </select>
                            <input type="text" id="ai-settings-custom-provider" class="ai-settings-input ai-custom-input" placeholder="Enter custom provider name" style="display: none;">
                        </div>
                        <div class="ai-settings-field">
                            <label for="ai-settings-apikey" class="ai-settings-label">API Key</label>
                            <input type="password" id="ai-settings-apikey" class="ai-settings-input" placeholder="Enter your API key" autocomplete="off">
                        </div>
                        <div class="ai-settings-field">
                            <label for="ai-settings-baseurl" class="ai-settings-label">Base URL</label>
                            <input type="text" id="ai-settings-baseurl" class="ai-settings-input" placeholder="https://...">
                        </div>
                        <div class="ai-settings-field">
                            <label for="ai-settings-model" class="ai-settings-label">Model</label>
                            <select id="ai-settings-model" class="ai-settings-select">
                                <option value="">Select Model</option>
                            </select>
                            <input type="text" id="ai-settings-custom-model" class="ai-settings-input ai-custom-input" placeholder="Enter custom model name" style="display: none;">
                        </div>
                        <div class="ai-settings-actions">
                            <button id="ai-settings-save-btn" class="ai-settings-save-btn">Save Settings</button>
                            <button id="ai-settings-cancel-btn" class="ai-settings-cancel-btn">Cancel</button>
                        </div>
                        <div id="ai-settings-status" class="ai-settings-status" role="status"></div>
                    </div>
                </div>
                
                <div class="ai-input-area">
                    <textarea id="ai-input" class="ai-input" placeholder="Type your message..." rows="3" aria-label="Message input"></textarea>
                    <button id="ai-send-btn" class="ai-send-btn" aria-label="Send message">Send</button>
                </div>
            </aside>
            
            <!-- Future-ready panels (Stage 2+) -->
            <aside id="app-left-panel"></aside>
            <aside id="app-right-panel"></aside>
            
        </main>
        
    </div>
    
    <!-- JavaScript loading order is critical -->
    <!-- 1. Storage must load first (used by canvas.js and canvas.engine.js) -->
    <script src="js/storage.js"></script>
    
    <!-- 2. Canvas Layout Engine (independent, for future AI layout features) -->
    <script src="js/canvas.layout.js"></script>
    
    <!-- 3. AI Schema Module (data validation and normalization for future AI) -->
    <script src="js/ai.schema.js"></script>
    
    <!-- 4. CanvasUI must load before canvas.js (provides styles and layoutHTML) -->
    <script src="canvas/canvas.ui.js"></script>
    
    <!-- 4. CanvasEngine must load before canvas.js (provides math functions) -->
    <script src="canvas/canvas.engine.js"></script>
    
    <!-- 5. Main canvas module loads last (depends on Storage, CanvasUI, CanvasEngine) -->
    <script src="canvas/canvas.js"></script>
    
    <!-- 6. Canvas API layer for external module control (Stage 2+) -->
    <script src="canvas/canvas.api.js"></script>
    
    <!-- 7. AI Actions Module (converts validated plans to actions) -->
    <script src="js/ai.actions.js"></script>
    
    <!-- 8. AI Settings Module (manages AI connection configuration) -->
    <script src="js/ai.settings.js"></script>
    
    <!-- 9. AI Providers Module (registry of supported AI providers) -->
    <script src="js/ai.providers.js"></script>
    
    <!-- 10. AI Client Module (communicates with AI providers) -->
    <script src="js/ai.client.js"></script>

    <!-- 11. AI Canvas Adapter Module (connects AI responses to Canvas pipeline) -->
    <script src="js/ai.canvas.adapter.js"></script>

    <!-- 12. AI Context Module (prepares context for AI requests) -->
    <script src="js/ai.context.js"></script>

    <!-- 13. AI Conversation Module (orchestrates AI conversation requests) -->
    <script src="js/ai.conversation.js"></script>

    <!-- 14. AI UI Module (user interface for AI chat interaction) -->
    <script src="js/ai.ui.js"></script>

    <!-- Application initialization -->
    <script>
        // Initialize the application after DOM is ready and all scripts are loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Update status
            const statusEl = document.getElementById('app-status');
            if (statusEl) {
                statusEl.textContent = 'Canvas Ready';
            }
            
            // Initialize the Canvas Manager
            if (typeof FreeCanvasManager !== 'undefined' && typeof FreeCanvasManager.render === 'function') {
                FreeCanvasManager.render();
            }
            
            // Initialize AI UI
            if (typeof AIUI !== 'undefined' && typeof AIUI.init === 'function') {
                AIUI.init();
            }
        });
    </script>
</body>
</html>
