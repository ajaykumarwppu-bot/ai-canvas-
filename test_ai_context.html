<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIContext Tests</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
        .test { margin: 10px 0; padding: 10px; border-left: 3px solid #666; }
        .pass { border-left-color: #4caf50; background: rgba(76, 175, 80, 0.1); }
        .fail { border-left-color: #f44336; background: rgba(244, 67, 54, 0.1); }
        .info { color: #9ccc65; }
        pre { background: #333; padding: 10px; overflow: auto; max-height: 300px; }
    </style>
</head>
<body>
    <h1>AIContext Module Tests</h1>
    <div id="results"></div>

    <!-- Load all dependencies -->
    <script src="js/storage.js"></script>
    <script src="canvas/canvas.ui.js"></script>
    <script src="canvas/canvas.engine.js"></script>
    <script src="canvas/canvas.js"></script>
    <script src="canvas/canvas.api.js"></script>
    <script src="js/ai.context.js"></script>

    <script>
        const results = document.getElementById('results');
        let passCount = 0;
        let failCount = 0;

        function logTest(name, passed, details = '') {
            const div = document.createElement('div');
            div.className = 'test ' + (passed ? 'pass' : 'fail');
            div.innerHTML = `<strong>${name}</strong>: ${passed ? '✅ PASS' : '❌ FAIL'}${details ? '<pre>' + details + '</pre>' : ''}`;
            results.appendChild(div);
            if (passed) passCount++; else failCount++;
        }

        function safeStringify(obj) {
            try { return JSON.stringify(obj, null, 2); } catch(e) { return String(obj); }
        }

        // Test 1: Empty Canvas
        console.log('Test 1: Empty Canvas');
        try {
            const result = AIContext.build();
            const passed = result.success === true && 
                          result.context && 
                          result.context.metadata.isEmpty === true;
            logTest('Test 1: Empty Canvas', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 1: Empty Canvas', false, e.message);
        }

        // Test 2: Basic Canvas with nodes
        console.log('Test 2: Basic Canvas');
        try {
            // Add some nodes via CanvasAPI
            CanvasAPI.addNode({ id: 'n1', text: 'Node 1', x: 100, y: 100 });
            CanvasAPI.addNode({ id: 'n2', text: 'Node 2', x: 300, y: 100 });
            CanvasAPI.addEdge({ fromNode: 'n1', toNode: 'n2' });

            const result = AIContext.build();
            const passed = result.success === true &&
                          result.context &&
                          result.context.nodes.length === 2 &&
                          result.context.connections.length === 1 &&
                          result.context.metadata.nodeCount === 2;
            logTest('Test 2: Basic Canvas', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 2: Basic Canvas', false, e.message);
        }

        // Test 3: Summary mode
        console.log('Test 3: Summary Mode');
        try {
            const result = AIContext.build({ mode: 'summary' });
            const passed = result.success === true &&
                          result.summary &&
                          result.summary.nodeCount >= 2 &&
                          !result.context; // Should not have full context in summary mode
            logTest('Test 3: Summary Mode', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 3: Summary Mode', false, e.message);
        }

        // Test 4: Context limits
        console.log('Test 4: Context Limits');
        try {
            const result = AIContext.build({ maxItems: 1 });
            const hasWarning = result.warnings.some(w => w.code === 'NODE_LIMIT_APPLIED');
            const passed = result.success === true &&
                          result.context.nodes.length <= 1 &&
                          hasWarning;
            logTest('Test 4: Context Limits', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 4: Context Limits', false, e.message);
        }

        // Test 5: Large content handling
        console.log('Test 5: Large Content');
        try {
            const largeText = 'A'.repeat(1000);
            CanvasAPI.addNode({ id: 'n_large', text: largeText });
            
            const result = AIContext.build();
            const nodeWithLargeText = result.context.nodes.find(n => n.id === 'n_large');
            const passed = result.success === true &&
                          nodeWithLargeText &&
                          nodeWithLargeText.title.length <= 503; // 500 + '...'
            logTest('Test 5: Large Content', passed, safeStringify({
                originalLength: largeText.length,
                truncatedLength: nodeWithLargeText?.title?.length
            }));
        } catch (e) {
            logTest('Test 5: Large Content', false, e.message);
        }

        // Test 6: Invalid options
        console.log('Test 6: Invalid Options');
        try {
            const result = AIContext.build({ mode: 'invalid_mode' });
            const passed = result.success === false &&
                          result.errors.some(e => e.code === 'INVALID_CONTEXT_OPTIONS');
            logTest('Test 6: Invalid Options', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 6: Invalid Options', false, e.message);
        }

        // Test 7: No Canvas modification (verify state unchanged)
        console.log('Test 7: No Canvas Modification');
        try {
            const stateBefore = CanvasAPI.getState();
            AIContext.build();
            AIContext.getSummary();
            AIContext.getCanvasContext();
            const stateAfter = CanvasAPI.getState();
            
            const passed = stateBefore.nodes.length === stateAfter.nodes.length &&
                          stateBefore.edges.length === stateAfter.edges.length;
            logTest('Test 7: No Canvas Modification', passed, 
                   `Before: ${stateBefore.nodes.length} nodes, After: ${stateAfter.nodes.length} nodes`);
        } catch (e) {
            logTest('Test 7: No Canvas Modification', false, e.message);
        }

        // Test 8: getCanvasContext method
        console.log('Test 8: getCanvasContext');
        try {
            const result = AIContext.getCanvasContext();
            const passed = result.success === true &&
                          result.context &&
                          Array.isArray(result.context.nodes) &&
                          Array.isArray(result.context.connections);
            logTest('Test 8: getCanvasContext', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 8: getCanvasContext', false, e.message);
        }

        // Test 9: getSummary method
        console.log('Test 9: getSummary');
        try {
            const result = AIContext.getSummary();
            const passed = result.success === true &&
                          result.summary &&
                          typeof result.summary.nodeCount === 'number' &&
                          typeof result.summary.connectionCount === 'number';
            logTest('Test 9: getSummary', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 9: getSummary', false, e.message);
        }

        // Test 10: clearCache
        console.log('Test 10: clearCache');
        try {
            AIContext.clearCache();
            const passed = true; // Should not throw
            logTest('Test 10: clearCache', passed, 'Cache cleared successfully');
        } catch (e) {
            logTest('Test 10: clearCache', false, e.message);
        }

        // Test 11: checkDependencies
        console.log('Test 11: checkDependencies');
        try {
            const result = AIContext.checkDependencies();
            const passed = result.ready === true && result.missing.length === 0;
            logTest('Test 11: checkDependencies', passed, safeStringify(result));
        } catch (e) {
            logTest('Test 11: checkDependencies', false, e.message);
        }

        // Test 12: getConfig
        console.log('Test 12: getConfig');
        try {
            const config = AIContext.getConfig();
            const passed = config.MAX_NODES > 0 && 
                          config.MAX_CONTENT_LENGTH > 0 &&
                          config.DEFAULT_MODE === 'full';
            logTest('Test 12: getConfig', passed, safeStringify(config));
        } catch (e) {
            logTest('Test 12: getConfig', false, e.message);
        }

        // Summary
        const summary = document.createElement('div');
        summary.className = 'test info';
        summary.innerHTML = `<strong>Summary</strong>: ${passCount} passed, ${failCount} failed`;
        results.appendChild(summary);

        console.log(`Tests complete: ${passCount} passed, ${failCount} failed`);
    </script>
</body>
</html>
